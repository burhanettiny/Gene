[server]
headless = true
# Cloud ortamında bu ayarları varsayılanda bırakmak daha sağlıklıdır
# enableCORS = false 
# enableXsrfProtection = false

[theme]
primaryColor = "#FF4B4B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"

[browser]
gatherUsageStats = false

[client]
# Hata ayrıntılarını görmek için geçici olarak true yapabilirsin
showErrorDetails = true 
toolbarMode = "minimal"
